idth="2"/></g><text x="24" y="260" fill="#66746E" font-size="11.5">to Expo City</text><text x="736" y="260" fill="#66746E" font-size="11.5" text-anchor="end">to Deira, airport</text><g data-part="tram"><path d="M133 140H283" stroke="#B5532B" fill="none" stroke-width="4" stroke-linecap="round"/><path d="M133 140C111 96 193 92 187 140" stroke="#B5532B" fill="none" stroke-width="4"/><path d="M151 146V192M183 146V192" stroke="#3FB57E" fill="none" stroke-width="2" stroke-dasharray="4 4"/><circle cx="151.3" cy="140" r="5" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="183.2" cy="140" r="5" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><text x="292.8" y="134" fill="#1B2622" font-weight="600">Dubai Tram</text><text x="292.8" y="150" fill="#66746E" font-size="11.5">a loop through Dubai Marina and JBR,</text><text x="292.8" y="166" fill="#66746E" font-size="11.5">joined to the metro at two stations</text></g><text x="24" y="76" fill="#66746E" font-size="11.5" font-weight="600">Sea side</text><text x="24" y="470" fill="#66746E" font-size="11.5" font-weight="600">Inland</text><g data-part="downtown"><circle cx="618.2" cy="350" r="34" fill="#B5532B" stroke="#B5532B" fill-opacity="0.08" stroke-width="4"/><path d="M618 246V316" stroke="#3FB57E" fill="none" stroke-width="2" stroke-dasharray="4 4"/><text x="618.2" y="404" fill="#1B2622" font-weight="600" text-anchor="middle">Downtown Dubai</text><text x="618.2" y="420" fill="#66746E" font-size="11.5" text-anchor="middle">loop boulevard round Burj Khalifa,</text><text x="618.2" y="436" fill="#66746E" font-size="11.5" text-anchor="middle">covered walkway to the station</text></g><g data-part="feeders"><path d="M108 246L98 418M350 246L368 418M463 246L443 418" stroke="#1F7A50" fill="none" stroke-width="3" stroke-dasharray="8 5" stroke-linecap="round"/><rect x="91.7" y="418" width="12" height="12" fill="#1B2622" stroke="none" rx="2"/><rect x="361.5" y="418" width="12" height="12" fill="#1B2622" stroke="none" rx="2"