<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-label="Like the body, the city can move people in four layers" font-size="13" font-family="Inter, Arial, sans-serif"><text x="24" y="30" fill="#1B2622" font-size="15" font-weight="600">Like the body, the city can move people in four layers</text><g data-part="spine"><path d="M40 196H720" stroke="#14302A" fill="none" stroke-width="6" stroke-linecap="round"/><text x="40" y="182" fill="#1B2622" font-weight="600">Spine</text></g><g data-part="loop-a"><circle cx="262" cy="196" r="62" fill="#B5532B" stroke="#B5532B" fill-opacity="0.08" stroke-width="4"/></g><g data-part="loop-b"><circle cx="514" cy="196" r="62" fill="#B5532B" stroke="#B5532B" fill-opacity="0.08" stroke-width="4"/></g><text x="262" y="176" fill="#1B2622" font-weight="600" text-anchor="middle">Loop</text><text x="514" y="176" fill="#1B2622" font-weight="600" text-anchor="middle">Loop</text><text x="262" y="230" fill="#66746E" font-size="11.5" text-anchor="middle">office hub</text><text x="514" y="230" fill="#66746E" font-size="11.5" text-anchor="middle">office hub</text><g data-part="tributaries"><path d="M218 152L140 92M293 250L330 322M558 152L640 92M483 250L452 322" stroke="#1F7A50" fill="none" stroke-width="4" stroke-linecap="round"/></g><g data-part="last-mile"><path d="M140 92L104 66M140 92L102 112M140 92L160 60M330 322L298 348M330 322L354 352M330 322L372 312M640 92L678 66M640 92L680 112M640 92L616 60M452 322L420 348M452 322L476 352M452 322L410 310" stroke="#3FB57E" fill="none" stroke-width="2" stroke-dasharray="4 4"/><rect x="99" y="61" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="97" y="107" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="155" y="55" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="293" y="343" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="349" y="347" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="367" y="307" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="673" y="61" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="675" y="107" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="611" y="55" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="415" y="343" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="471" y="347" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/><rect x="405" y="305" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/></g><g data-part="nodes"><circle cx="218.2" cy="152.2" r="6" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="293.0" cy="249.7" r="6" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="557.8" cy="152.2" r="6" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="483.0" cy="249.7" r="6" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="140" cy="92" r="5" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="330" cy="322" r="5" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="640" cy="92" r="5" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="452" cy="322" r="5" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="200" cy="196" r="8" fill="#E9E5DA" stroke="#14302A" stroke-width="2"/><circle cx="324" cy="196" r="8" fill="#E9E5DA" stroke="#14302A" stroke-width="2"/><circle cx="452" cy="196" r="8" fill="#E9E5DA" stroke="#14302A" stroke-width="2"/><circle cx="576" cy="196" r="8" fill="#E9E5DA" stroke="#14302A" stroke-width="2"/></g><g data-part="key-spine"><line x1="24" y1="380" x2="56" y2="380" stroke="#14302A" stroke-width="6"/><text x="64" y="384" fill="#1B2622" font-weight="600">Spine</text><text x="64" y="400" fill="#1B2622" font-size="11.5">Metro line across the city</text><text x="64" y="416" fill="#66746E" font-size="11.5">Body: the aorta</text></g><g data-part="key-loop"><circle cx="40" cy="438" r="11" fill="#B5532B" stroke="#B5532B" fill-opacity="0.08" stroke-width="3"/><text x="64" y="442" fill="#1B2622" font-weight="600">Loop</text><text x="64" y="458" fill="#1B2622" font-size="11.5">Metro Loop of median buses around an office hub</text><text x="64" y="474" fill="#66746E" font-size="11.5">Body: a circulation loop</text></g><g data-part="key-trib"><line x1="24" y1="496" x2="56" y2="496" stroke="#1F7A50" stroke-width="4"/><text x="64" y="500" fill="#1B2622" font-weight="600">Tributary</text><text x="64" y="516" fill="#1B2622" font-size="11.5">Metro Corridor joining a loop</text><text x="64" y="532" fill="#66746E" font-size="11.5">Body: an artery</text></g><g data-part="key-node"><g ><circle cx="402" cy="380" r="6" fill="#1B2622" stroke="#E9E5DA" stroke-width="1.5"/><circle cx="420" cy="380" r="8" fill="#E9E5DA" stroke="#14302A" stroke-width="2"/></g><text x="436" y="384" fill="#1B2622" font-weight="600">Node</text><text x="436" y="400" fill="#1B2622" font-size="11.5">Where a corridor or the metro meets a loop</text><text x="436" y="416" fill="#66746E" font-size="11.5">Body: where vessels join</text></g><g data-part="key-last"><g ><line x1="396" y1="438" x2="420" y2="438" stroke="#3FB57E" stroke-width="2" stroke-dasharray="4 4"/><rect x="422" y="433" width="10" height="10" fill="#1B2622" stroke="none" rx="2"/></g><text x="436" y="442" fill="#1B2622" font-weight="600">Last mile</text><text x="436" y="458" fill="#1B2622" font-size="11.5">Walk, scoot or auto from home to the nearest node</text><text x="436" y="474" fill="#66746E" font-size="11.5">Body: the capillaries</text></g><text x="24" y="50" fill="#66746E" font-size="11.5">Each layer does one job and meets the next only at fixed points</text></svg>